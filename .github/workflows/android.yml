name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Inspect package
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$AAPT" dump badging "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Give APK a clear file name
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk             app/build/outputs/apk/debug/TV-IR-Controller_v1.2.0_Android16_Samsung-Philips-QM16.3E.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-IR-Controller_v1.2.0_Android16_Samsung-Philips-QM16.3E
          path: app/build/outputs/apk/debug/TV-IR-Controller_v1.2.0_Android16_Samsung-Philips-QM16.3E.apk
